<!DOCTYPE html>
 <html lang="fr">
    <head>
        <meta charset="utf-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1"> 
        <title>{% block title %}Gestion des tâches{% endblock %}</title>  
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> 
    </head>
    <body class="bg-light">
            <nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4"> 
                <div class="container">   
                  <a class="navbar-brand" href="{% url 'taches:tache_liste' %}">Gestion des tâches</a>   
                    <div class="navbar-nav me-auto">     
                     <a class="nav-link" href="{% url 'taches:tache_liste' %}">Tâches</a>   
                     <a class="nav-link" href="{% url 'taches:projet_liste' %}">Projets</a>    
                    </div>    
                       <a class="btn btn-outline-light btn-sm" href="{% url 'admin:index' %}">Administration</a>  
                </div> 
            </nav> 
                <main class="container pb-5">  {% for message in messages %}    
                    <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show">      {{ message }}      
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>    
                    </div>  
                    {% endfor %}  {% block content %}{% endblock %} 
                </main> 
                <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> 
    </body> 
</html>

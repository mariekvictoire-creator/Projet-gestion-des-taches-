{% extends "base.html" %} 
{% block title %}Confirmer la suppression{% endblock %} {% block content %} 
<div class="card shadow-sm border-danger">
    <div class="card-body">  
        <h1 class="h5">Supprimer {{ libelle }} ?</h1>  
        {% if avertissement %}
        <p class="text-danger">{{ avertissement }}</p>
        {% endif %}  
        <form method="post">    
            {% csrf_token %}    
            
            <button class="btn btn-danger" type="submit">Oui, supprimer</button>    
            <a class="btn btn-outline-secondary" href="{{ annuler_url }}">Annuler</a>  
        </form> 
    </div>
</div> 
{% endblock %}

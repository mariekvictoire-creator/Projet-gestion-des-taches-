{% extends "base.html" %} 
{% block title %}{% if object %}Modifier la tâche{% else %}Nouvelle tâche{% endif %}{% endblock %} 
{% block content %} 
<h1 class="h4 mb-3">{% if object %}Modifier la tâche{% else %}Nouvelle tâche{% endif %}</h1> 
<div class="card shadow-sm">
    <div class="card-body">  
        <form method="post" novalidate>    
            {% csrf_token %}    
            {% include "taches/_form_fields.html" %}    
            <button class="btn btn-primary" type="submit">Enregistrer</button>    
            <a class="btn btn-outline-secondary" href="{% url 'taches:tache_liste' %}">Annuler</a>  
        </form> 
    </div>
</div> 
{% endblock %}
